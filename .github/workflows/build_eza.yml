name: Build eza

on:
  - workflow_dispatch

jobs:
  wheel:
    name: build-${{ matrix.os }}-${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: nu {0}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            flags: --zig
            tag: manylinux_2_28_x86_64.musllinux_1_2_x86_64
            test: true
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            flags: --zig
            tag: manylinux_2_28_aarch64.musllinux_1_2_aarch64
            test: true
          - os: ubuntu-latest
            target: riscv64gc-unknown-linux-musl
            flags: --zig
            tag: manylinux_2_31_riscv64.musllinux_1_2_riscv64
            test: false
          - os: macos-latest
            target: x86_64-apple-darwin
            flags: ""
            test: false
          - os: macos-latest
            target: aarch64-apple-darwin
            flags: ""
            test: true
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            flags: ""
            test: true
          - os: windows-11-arm
            target: aarch64-pc-windows-msvc
            flags: ""
            test: true

    steps:
      - uses: hustcer/setup-nu@95cd3bfe252450ef7d35dd9a7ddecf3484341134 # v3.28
      - uses: actions/checkout@v7
      - run: git submodule update --init -- eza/eza
      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          command: build
          args: --release --out dist ${{ matrix.flags }}
          target: ${{ matrix.target }}
          manylinux: musllinux_1_2
          working-directory: ./eza

      - name: Post Processing wheel
        if: matrix.tag
        shell: bash
        run: |
          sudo chmod -R 777 dist
          uvx wheel tags --remove --platform-tag ${{ matrix.tag }} dist/*.whl
        working-directory: ./eza

      - run: ls eza/dist

      - name: Install test
        if: matrix.test
        run: |-
          pip install --no-index -f eza/dist/ eza-bin
          which eza
          eza --version

          if not (eza --version | str contains "+git") {
            error make { msg: "eza was built without git support" }
          }
          eza --long --git --no-user --no-time eza

          do -i { objdump -T (which eza | get path.0) }

      - uses: actions/upload-artifact@v7
        with:
          name: wheel-${{ matrix.os }}-${{ matrix.target }}-${{ github.run_attempt }}
          path: eza/dist/*.whl
          if-no-files-found: error

  sdist:
    name: sdist
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - run: git submodule update --init -- eza/eza
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0

      - run: uv build --sdist
        working-directory: ./eza

      - run: ls eza/dist

      - uses: actions/upload-artifact@v7
        with:
          name: sdist
          path: eza/dist/*.tar.gz
          if-no-files-found: error

  publish:
    name: publish
    runs-on: ubuntu-latest
    needs: [sdist, wheel]
    environment: publish
    permissions:
      id-token: write
      attestations: write
      artifact-metadata: write

    steps:
      - uses: actions/download-artifact@v8
        with:
          merge-multiple: true
          path: dist

      - uses: actions/attest@v4
        with:
          subject-path: dist/*

      - run: ls dist

      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: dist
          skip-existing: true
