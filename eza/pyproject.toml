[project]
name = "eza-bin"
description = "A modern alternative to ls"
readme = "README.md"
requires-python = ">=3.7"
authors = [{ name = "dowon", email = "ks2515@naver.com" }]
keywords = ["cli", "exa", "eza", "file-listing", "ls"]
classifiers = [
  "Programming Language :: Rust",
  "Topic :: System :: Filesystems",
  "Topic :: Terminals",
  "Topic :: Utilities",
]
dependencies = []
dynamic = ["license", "version"]

[project.urls]
eza = "https://github.com/eza-community/eza"
repository = "https://github.com/Bing-su/pip-binary-factory"

[build-system]
requires = ["maturin>=1.15,<2.0"]
build-backend = "maturin"

[tool.maturin]
auditwheel = "repair"
bindings = "bin"
features = ["vendored-libgit2", "vendored-openssl"]
include = [
  { format = "sdist", path = "LICENSE" },
  { format = "sdist", path = "LICENSE-MIT" },
]
manifest-path = "eza/Cargo.toml"
profile = "release"
strip = true
